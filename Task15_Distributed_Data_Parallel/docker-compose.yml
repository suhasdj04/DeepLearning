version: '3.8'

services:
  master:
    build: .
    environment:
      - WORLD_SIZE=2
      - RANK=0
      - MASTER_ADDR=master
      - MASTER_PORT=12355
    volumes:
      - .:/workspace
    network_mode: "host"

  worker:
    build: .
    environment:
      - WORLD_SIZE=2
      - RANK=1
      - MASTER_ADDR=master
      - MASTER_PORT=12355
    volumes:
      - .:/workspace
    network_mode: "host"
